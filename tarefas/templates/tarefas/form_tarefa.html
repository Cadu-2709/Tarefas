{% extends 'tarefas/base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h5 class="mb-0 text-primary">
                    <i class="fa-solid fa-pen-to-square me-2"></i>{{ titulo }}
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                        <a href="{% url 'lista_tarefas' %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-brand px-4">Salvar Dados</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
