{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Cores extraídas da Logo da Proxmon */
            --proxmon-dark: #12263A;  /* O Azul escuro das letras */
            --proxmon-blue: #0084FF;  /* O Azul vibrante do X */
            --bg-light: #f4f6f9;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar com a cor escura da marca */
        .navbar-custom {
            background-color: var(--proxmon-dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        /* Botões com o azul vibrante do "X" */
        .btn-brand {
            background-color: var(--proxmon-blue);
            color: white;
            border: none;
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #006bcf; /* Um pouco mais escuro ao passar o mouse */
            color: white;
        }

        /* Cards e Tabelas */
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .card-header {
            background-color: white;
            border-bottom: 1px solid #eee;
        }
        
        /* Ajuste fino para a logo na barra */
        .navbar-brand img {
            height: 30px; /* Tamanho da logo */
            width: auto;
        }

        /* Status Pills */
        .status-nao_iniciado { background-color: #ffebee; color: #c62828; }
        .status-iniciado { background-color: #fff8e1; color: #f57f17; }
        .status-feito { background-color: #e8f5e9; color: #2e7d32; }
        
        .prazo-atrasado { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'lista_tarefas' %}">
                <img src="{% static 'img/logoof.png' %}" alt="ss" class="me-2">
            </a>
            
            <div class="text-white d-none d-md-block">
                <small class="opacity-75">Tarefas empresas</small>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center py-4 mt-auto text-muted small bg-white border-top">
        &copy; Bora gurizada
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
